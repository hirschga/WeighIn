{"name":"Verify clean candidate","on":{"push":{"branches":["validation/weighin-113"],"paths":[".github/workflows/verify-clean.yml"]}},"permissions":{"contents":"read"},"jobs":{"check":{"runs-on":"ubuntu-latest","timeout-minutes":15,"env":{"NODE_OPTIONS":"--test-reporter=tap"},"strategy":{"fail-fast":false,"matrix":{"include":[{"label":"baseline","ref":"36c25e60bf66f1176099cd66bb803cd04bf4af72"},{"label":"candidate","ref":"1c020a2a4bd7c9af85455f586ef83075089ec6c1"}]}},"steps":[{"uses":"actions/checkout@v4","with":{"ref":"${{ matrix.ref }}"}},{"uses":"actions/setup-node@v4","with":{"node-version":"24"}},{"run":"npm ci\ncargo +1.95.0 fetch --locked --manifest-path native/simulation/Cargo.toml\nnode -e \"require('fs').mkdirSync('/tmp/warm',{recursive:true});require('fs').writeFileSync('/tmp/warm/package.json',JSON.stringify({dependencies:require('./package.json').dependencies}))\"\nnpm install --prefix /tmp/warm --ignore-scripts --no-audit --no-fund\npython - <<'PYTHON'\nimport subprocess,re,pathlib,json\nr=subprocess.run(['npm','test'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)\npathlib.Path('validation.log').write_text(r.stdout)\nf=sorted(re.findall(r'^not ok \\d+ - (.+)$',r.stdout,re.M))\nprint(r.stdout[-1800:])\nprint('FAILURES='+json.dumps(f))\nassert f==['measureInvocation interrupts captive-core transient read backoff delay promptly','retained ledger-variatio archive matches all SHA256 checksums and satisfies all acceptance criteria']\nassert r.returncode==1\nPYTHON"},{"if":"matrix.label == 'candidate'","run":"npm run lint\nnpm run typecheck\nnpm run build\nnpm run test:vitest\nnpm run bundle\ngit diff --check\ngit diff --exit-code -- bundled/index.js bundled/comment-action.js\nnpm audit --audit-level=moderate"},{"uses":"actions/upload-artifact@v4","if":"always()","with":{"name":"validation-${{ matrix.label }}","path":"validation.log"}}]}}}}
